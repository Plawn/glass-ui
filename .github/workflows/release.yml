name: Release

# Pushing a tag `vX.Y.Z` publishes that commit to npm and creates the GitHub
# release from the matching CHANGELOG.md section.
#
# npm dist-tag:
#   - prerelease (X.Y.Z-anything)            -> next
#   - `publishConfig.tag` in package.json    -> that tag (maintenance branches)
#   - otherwise                              -> latest
#
# Authentication uses npm trusted publishing (OIDC): no token is stored. The
# package must list this repository and `release.yml` as a trusted publisher
# on npmjs.com.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing + provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # No `registry-url`: it would write a placeholder auth token into .npmrc,
      # which hides trusted publishing failures behind a 404.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Trusted publishing needs npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - name: Resolve version and dist-tag
        id: meta
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          configured=$(node -p "require('./package.json').publishConfig?.tag ?? ''")

          if [ "$TAG_NAME" != "v$version" ]; then
            echo "::error::Tag $TAG_NAME does not match package.json version $version"
            exit 1
          fi

          if ! grep -qxF "## $version" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          fi

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
            dist_tag=next
          elif [ -n "$configured" ]; then
            dist_tag=$configured
          else
            dist_tag=latest
          fi

          # Never let an older line take over `latest`
          current_latest=$(npm view "$name" dist-tags.latest 2>/dev/null || true)
          if [ "$dist_tag" = latest ] && [ -n "$current_latest" ]; then
            highest=$(printf '%s\n%s\n' "$current_latest" "$version" | sort -V | tail -n 1)
            if [ "$highest" != "$version" ]; then
              echo "::error::$version is older than latest ($current_latest). Set publishConfig.tag in package.json on this maintenance branch."
              exit 1
            fi
          fi

          published=false
          if [ -n "$(npm view "$name@$version" version 2>/dev/null || true)" ]; then
            published=true
          fi

          {
            echo "name=$name"
            echo "version=$version"
            echo "dist_tag=$dist_tag"
            echo "prerelease=$prerelease"
            echo "published=$published"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $name@$version with dist-tag '$dist_tag' (already published: $published)"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # Scripts are skipped: the build above is the one being published.
      - name: Publish to npm
        if: steps.meta.outputs.published == 'false'
        env:
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}
        run: npm publish --access public --ignore-scripts --tag "$DIST_TAG" --loglevel verbose

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "GitHub release $TAG_NAME already exists"
            exit 0
          fi

          flags=(--title "$TAG_NAME" --notes-file release-notes.md --verify-tag)
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          if [ "$DIST_TAG" = latest ]; then
            flags+=(--latest)
          else
            flags+=(--latest=false)
          fi
          gh release create "$TAG_NAME" "${flags[@]}"
